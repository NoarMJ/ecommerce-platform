name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    # Prisma needs these values to generate its client during install.
    # This workflow does not connect to a database.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint the client
        run: npm --prefix client run lint

      - name: Test the client
        run: npm --prefix client test

      - name: Build the client
        run: npm --prefix client run build

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: server

      - name: Lint the server
        run: npm --prefix server run lint

      - name: Test the server
        run: npm --prefix server test

      - name: Run server health check
        run: npm --prefix server run test:e2e